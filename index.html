<!doctype html>
<html lang="fr" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <meta name="description" content="Plateforme officielle de gestion scolaire de la Circonscription d'Éducation de Base de Bagré (Burkina Faso) — élèves, notes, registres d'appel, bulletins et statistiques.">
  <meta name="application-name" content="Educ CEB Bagré">
  <title>Educ CEB Bagré — Plateforme de Gestion Scolaire</title>
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Educ CEB Bagré">
  <meta name="apple-mobile-web-app-status-bar-style" content="#0f3d23">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="slogan-banner" role="note" aria-label="Slogan éducatif">
    <div class="slogan-banner__track">
      <span>🎓 La rigueur pédagogique et l'innovation numérique au cœur de chaque classe de Bagré.</span>
      <span aria-hidden="true">🎓 La rigueur pédagogique et l'innovation numérique au cœur de chaque classe de Bagré.</span>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="printHeader" class="print-only">
    <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px">
      <strong style="font-size:16px;letter-spacing:.5px">EDUC CEB BAGRÉ</strong><br>
      <span style="font-size:12px">Circonscription de Bagré — Plateforme de Gestion Scolaire</span>
    </div>
  </div>
  <div id="app" class="notranslate" translate="no">
    <div id="bootLoader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff;text-align:center;padding:24px;background:linear-gradient(145deg,#0B1E3D 0%,#103A6E 48%,#0F5C6E 100%)">
      <img src="/icon-192.png" alt="" width="72" height="72" style="width:72px;height:72px;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)">
      <p style="margin:0;font-weight:700;font-size:18px;letter-spacing:.3px">Educ CEB Bagré</p>
      <p style="margin:6px 0 0;opacity:.88;font-size:13px">Chargement de l'application…</p>
    </div>
  </div>
  <script>
    (function () {
      function showBootError() {
        var loader = document.getElementById('bootLoader');
        if (!loader) return;
        loader.innerHTML = '<p style="color:#dc2626;max-width:520px">Impossible de charger l\'application. Vérifiez votre connexion puis rechargez la page.</p>';
      }
      window.addEventListener('error', showBootError);
      window.addEventListener('unhandledrejection', showBootError);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
